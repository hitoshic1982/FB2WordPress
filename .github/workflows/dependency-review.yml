name: Dependency Review

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '53 18 * * 4'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed-dependencies:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  scheduled-baseline:
    name: Scheduled NuGet baseline
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Audit all NuGet dependencies
        shell: pwsh
        run: |
          $projects = @(
            'src/FB2WordPress.Core/FB2WordPress.Core.csproj',
            'src/FB2WordPress.Desktop/FB2WordPress.Desktop.csproj',
            'src/FB2WordPress/FB2WordPress.csproj'
          )
          foreach ($project in $projects) {
            dotnet restore $project -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
